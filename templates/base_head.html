<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <meta name="description" content="{{ page_description }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://zigmund.io{{ page_canonical }}">
  <meta name="theme-color" content="#0d1117">
  <!-- Open Graph -->
  <meta property="og:type" content="{{ og_type }}">
  <meta property="og:url" content="https://zigmund.io{{ page_canonical }}">
  <meta property="og:title" content="{{ page_title }}">
  <meta property="og:description" content="{{ page_description }}">
  <meta property="og:site_name" content="Zigmund">
  <meta property="og:image" content="https://zigmund.io/static/img/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page_title }}">
  <meta name="twitter:description" content="{{ page_description }}">
  <meta name="twitter:image" content="https://zigmund.io/static/img/og-image.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/docs.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>⚡</text></svg>">
</head>
<body>

  <!-- Scanline overlay -->
  <div class="scanlines"></div>

  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="/" class="nav-logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">zigmund</span>
        <span class="logo-ver">v0.1.0</span>
      </a>
      <div class="nav-links">
        <a href="/learn">Learn</a>
        <a href="/docs">Docs</a>
        <a href="/#features">Features</a>
        <a href="https://github.com/Softorize/zigmund" target="_blank" rel="noopener">
          GitHub
          <span class="ext-icon">↗</span>
        </a>
      </div>
      <button class="nav-mobile-toggle" aria-label="Toggle navigation" onclick="document.querySelector('.nav-links').classList.toggle('nav-links-open')">☰</button>
    </div>
  </nav>
