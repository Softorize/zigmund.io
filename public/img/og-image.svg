<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bolt-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="green-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="20%" stop-color="#00ff41"/>
      <stop offset="80%" stop-color="#00ff41"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="bolt-shadow">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
    <filter id="text-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00ff41" flood-opacity="0.3"/>
    </filter>
    <pattern id="scanlines" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="2" fill="transparent"/>
      <rect y="2" width="4" height="2" fill="rgba(0,0,0,0.04)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#scanlines)" opacity="0.5"/>

  <!-- Border lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#21262d" stroke-width="1"/>
  <line x1="0" y1="629" x2="1200" y2="629" stroke="#21262d" stroke-width="1"/>
  <line x1="1" y1="0" x2="1" y2="630" stroke="#21262d" stroke-width="1"/>
  <line x1="1199" y1="0" x2="1199" y2="630" stroke="#21262d" stroke-width="1"/>

  <!-- Top green accent line -->
  <rect x="200" y="0" width="800" height="2" fill="url(#green-line)" opacity="0.6"/>

  <!-- Lightning bolt -->
  <g transform="translate(130, 90)" filter="url(#bolt-shadow)">
    <polygon points="180,0 60,200 140,200 80,420 280,160 190,160 260,0"
             fill="url(#bolt-glow)" opacity="0.95"/>
    <polygon points="190,30 90,190 150,190 100,380 260,170 195,170 245,30"
             fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- "zigmund" text -->
  <text x="500" y="255" font-family="'Courier New', monospace" font-size="90"
        font-weight="700" fill="#f0f6fc" letter-spacing="5" filter="url(#text-glow)">zigmund</text>

  <!-- Tagline -->
  <text x="500" y="320" font-family="'Courier New', monospace" font-size="24"
        fill="#8b949e" letter-spacing="1">A FastAPI-inspired web framework for Zig</text>

  <!-- Terminal prompt -->
  <text x="500" y="390" font-family="'Courier New', monospace" font-size="20" fill="#8b949e">
    <tspan fill="#00ff41">zigmund</tspan><tspan fill="#8b949e">@</tspan><tspan fill="#00d4ff">dev</tspan><tspan fill="#8b949e">:~$ </tspan><tspan fill="#c9d1d9">zig build run</tspan><tspan fill="#00ff41">_</tspan>
  </text>

  <!-- Feature pills -->
  <g transform="translate(500, 430)">
    <rect x="0" y="0" width="120" height="30" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="60" y="20" font-family="'Courier New', monospace" font-size="13"
          fill="#00ff41" text-anchor="middle">Type-Safe</text>

    <rect x="136" y="0" width="80" height="30" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="176" y="20" font-family="'Courier New', monospace" font-size="13"
          fill="#f97316" text-anchor="middle">Fast</text>

    <rect x="232" y="0" width="110" height="30" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="287" y="20" font-family="'Courier New', monospace" font-size="13"
          fill="#a78bfa" text-anchor="middle">OpenAPI 3.1</text>

    <rect x="358" y="0" width="70" height="30" rx="4" fill="none" stroke="#30363d" stroke-width="1"/>
    <text x="393" y="20" font-family="'Courier New', monospace" font-size="13"
          fill="#00d4ff" text-anchor="middle">MIT</text>
  </g>

  <!-- Bottom domain -->
  <text x="600" y="570" font-family="'Courier New', monospace" font-size="18"
        fill="#30363d" text-anchor="middle" letter-spacing="3">zigmund.io</text>

  <!-- Bottom green accent line -->
  <rect x="200" y="628" width="800" height="2" fill="url(#green-line)" opacity="0.6"/>
</svg>
