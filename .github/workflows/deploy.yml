name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev zlib1g-dev

      - name: Build documentation
        run: |
          pip install markdown
          python3 scripts/build_docs.py

      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"

          # Stop service
          $SSH_CMD "systemctl stop zigmund-website || true"

          # Upload binary
          rsync -avz -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            zig-out/bin/zigmund-website \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/zigmund-website/zig-out/bin/

          # Upload static files
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            public/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/zigmund-website/public/

          # Upload content (generated docs)
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            content/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/zigmund-website/content/

          # Upload templates
          rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            templates/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/zigmund-website/templates/

          # Restart and verify
          $SSH_CMD "chmod +x /opt/zigmund-website/zig-out/bin/zigmund-website && systemctl start zigmund-website && sleep 2 && curl -sf http://localhost:3000/health"

          echo "Deploy successful!"
